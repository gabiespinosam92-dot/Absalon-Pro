<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Absalon Pro 3.0</title>

    <meta name="theme-color" content="#111827">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">

    <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

</head>
<link rel="icon" href="assets/icons/favicon.ico">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

<body>

<!-- === VENTANA DE ACCESO SEGURO (BLOQUEO DE CONTRASEÑA) === -->
<div id="loginModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.95); display:flex; align-items:center; justify-content:center; z-index:99999; font-family:sans-serif;">
  <div style="background:#1e293b; padding:35px; border-radius:12px; color:#f8fafc; width:320px; box-shadow:0 10px 25px rgba(0,0,0,0.5); border:1px solid #334155; text-align:center;">
    <h2 style="margin-top:0; color:#38bdf8; font-size:22px;">Absalon Pro 3.0</h2>
    <p style="font-size:13px; color:#94a3b8; margin-bottom:20px;">Ingrese su contraseña de seguridad</p>
    <form id="loginForm">
      <!-- Cambiá la contraseña por la que quieras abajo en el script si lo deseas -->
      <input type="password" id="inputPassword" placeholder="Contraseña" required style="width:100%; padding:12px; margin-bottom:15px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#fff; box-sizing:border-box; font-size:16px; text-align:center;">
      <button type="submit" style="width:100%; padding:12px; border:none; border-radius:6px; background:#0284c7; color:#fff; font-weight:bold; cursor:pointer; font-size:15px;">Ingresar al Sistema</button>
      <p id="loginError" style="color:#f87171; font-size:12px; margin-top:12px; display:none;">Contraseña incorrecta</p>
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('loginModal');
    const form = document.getElementById('loginForm');
    const input = document.getElementById('inputPassword');
    const errorMsg = document.getElementById('loginError');

    // CONTRASEÑA DE ACCESO (Podés cambiar 'absalon2026' por la que prefieras)
    const CLAVE_SECRETA = "absalon2026"; 

    if (sessionStorage.getItem('absalon_auth') === 'true') {
      modal.style.display = 'none';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value === CLAVE_SECRETA) {
        sessionStorage.setItem('absalon_auth', 'true');
        modal.style.display = 'none';
      } else {
        errorMsg.style.display = 'block';
        input.value = '';
      }
    });
  });
</script>

<div id="app">

    <header class="topbar">

        <div class="logo" style="display: flex; align-items: center; gap: 10px;">

            <img src="logo_2.png" alt="Absalon Pro Logo" style="width: 32px; height: 32px; object-fit: contain;">

            <div class="logo-text">

                <h1>ABSALON PRO</h1>

                <small>
                    Versión 3.0.0
                    ·
                    Build 001
                </small>

            </div>

        </div>

        <div class="topbar-actions">

            <button
                id="btnDarkMode"
                class="icon-button"
                title="Modo oscuro">

                🌙

            </button>

            <button
                id="btnSettings"
                class="icon-button"
                title="Configuración">

                ⚙

            </button>

        </div>

    </header>

    <aside id="sidebar">

        <nav>

            <button class="menu-item active"
                    data-view="dashboard">

                🏠
                <span>Dashboard</span>

            </button>

            <button class="menu-item"
                    data-view="agenda">

                📅
                <span>Agenda</span>

            </button>

            <button class="menu-item"
                    data-view="clientes">

                👥
                <span>Clientes</span>

            </button>

            <button class="menu-item"
                    data-view="presupuestos">

                📄
                <span>Presupuestos</span>

            </button>

            <button class="menu-item"
                    data-view="catalogos">

                📚
                <span>Catálogos</span>

            </button>

            <button class="menu-item"
                    data-view="historial">

                📂
                <span>Historial</span>

            </button>

	    <button class="menu-item" data-view="construccionSeco">
               <span>🧮</span> Calc. Seco
	    </button>

            <button class="menu-item" data-view="albanileria">
               <span>🧱</span> Albañilería
	    </button>

	    <button class="menu-item" data-view="electricidad">
               <span>⚡</span> Electricidad
	    </button>

            <button class="menu-item" data-view="refrigeracion">
               <span>❄️</span> Refrigeración
	    </button>

            <button class="menu-item"
                    data-view="estadisticas">

                📊
                <span>Estadísticas</span>

            </button>

            <button class="menu-item"
                    data-view="garantias">

                🛡
                <span>Garantías</span>

            </button>

            <button class="menu-item"
                    data-view="fotos">

                📸
                <span>Fotos</span>

            </button>

            <button class="menu-item"
                    data-view="configuracion">

                ⚙
                <span>Configuración</span>

            </button>

        </nav>

    </aside>

    <main id="mainContent">

        <div id="workspace">

            <div class="welcome-card">
                <h2>Bienvenido a Absalon Pro</h2>
                <p>Sistema profesional para presupuestos, clientes, catálogos y garantías.</p>
            </div>

            <div class="cards-grid">

                <div class="dashboard-card">
                    <h3>👥 Clientes</h3>
                    <span id="clientesCount">0</span>
                </div>

                <div class="dashboard-card">

                </div>

                <div class="dashboard-card">
                    <h3>📚 Catálogos</h3>
                    <span id="catalogosCount">0</span>
                </div>

                <div class="dashboard-card">
                    <h3>🛡 Garantías</h3>
                    <span id="garantiasCount">0</span>
                </div>

            </div>

        </div>

    </main>

    <nav class="bottom-nav">
        <button class="bottom-item active" data-view="dashboard">
            <span class="bottom-icon">🏠</span>
            <span class="bottom-text">Inicio</span>
        </button>

        <button class="bottom-item" data-view="agenda">
            <span class="bottom-icon">📅</span>
            <span class="bottom-text">Agenda</span>
        </button>
        <button class="bottom-item" data-view="clientes">
            <span class="bottom-icon">👥</span>
            <span class="bottom-text">Clientes</span>
        </button>
        <button class="bottom-item" data-view="presupuestos">
            <span class="bottom-icon">📄</span>
            <span class="bottom-text">Presupuestos</span>
        </button>
        <button class="bottom-item" data-view="construccionSeco">
            <span class="bottom-icon">🧮</span>
            <span class="bottom-text">Seco</span>
        </button>
    </nav>

</div>

<script type="module" src="app.js"></script>

</html>
